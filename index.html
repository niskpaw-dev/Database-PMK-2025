<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pelepasan PMK 2025</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
</head>
<body class="bg-slate-50 min-h-screen">

    <nav class="bg-blue-900 p-4 text-white shadow-lg">
        <div class="container mx-auto">
            <h1 class="text-xl font-bold uppercase tracking-wider text-center">Dashboard Analisis Pelepasan 2 PMK 2025</h1>
        </div>
    </nav>

    <div class="container mx-auto p-6">
        <!-- Loading Spinner -->
        <div id="loading" class="text-center py-10 text-blue-600 font-bold">
            Memuatkan Data dari Google Sheets...
        </div>

        <!-- Dashboard Content (Hidden until loaded) -->
        <div id="content" class="hidden">
            <!-- Scorecards -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
                <div class="bg-white p-6 rounded-xl shadow-md border-l-8 border-blue-500">
                    <p class="text-gray-500 text-sm font-semibold uppercase">Jumlah Murid</p>
                    <h3 id="statTotal" class="text-3xl font-bold">0</h3>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-md border-l-8 border-green-500">
                    <p class="text-gray-500 text-sm font-semibold uppercase">Lulus Arus Perdana</p>
                    <h3 id="statLulus" class="text-3xl font-bold text-green-600">0</h3>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-md border-l-8 border-orange-500">
                    <p class="text-gray-500 text-sm font-semibold uppercase">Bilangan Sekolah</p>
                    <h3 id="statSekolah" class="text-3xl font-bold">0</h3>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-md border-l-8 border-red-500">
                    <p class="text-gray-500 text-sm font-semibold uppercase">Murid OKU</p>
                    <h3 id="statOKU" class="text-3xl font-bold text-red-600">0</h3>
                </div>
            </div>

            <!-- Charts Row -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-10">
                <div class="bg-white p-6 rounded-xl shadow-md">
                    <h4 class="font-bold mb-4 text-gray-700">Analisis Perbandingan Darjah</h4>
                    <canvas id="gradeChart"></canvas>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-md">
                    <h4 class="font-bold mb-4 text-gray-700">Kategori PAKK (Prasekolah)</h4>
                    <canvas id="pakkChart"></canvas>
                </div>
            </div>

            <!-- Table Row -->
            <div class="bg-white p-8 rounded-xl shadow-md overflow-x-auto">
                <h4 class="font-bold mb-6 text-gray-700 underline">Senarai Perincian Murid</h4>
                <table id="tableMurid" class="display w-full border-collapse">
                    <thead class="bg-gray-100 text-xs">
                        <tr>
                            <th>NAMA MURID</th>
                            <th>SEKOLAH</th>
                            <th>DARJAH</th>
                            <th>STATUS F1</th>
                            <th>STATUS F2</th>
                            <th>OKU</th>
                        </tr>
                    </thead>
                    <tbody class="text-sm"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <script>
        // GANTIKAN DENGAN URL WEB APP GAS ANDA
        const API_URL = "https://script.google.com/macros/s/AKfycbx9NW2fwiJZAYOAfRfBlfDDLnoABkj4uJ4UUZE6yPWzdhGoi8Qb9toMEIg5Vy2rFVG4bQ/exec";

fetch(API_URL)
    .then(res => res.json())
    .then(data => {
        console.log("Data Diterima:", data[0]); // Debug di Console (F12)
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');
        processData(data);
    })
    .catch(err => {
        document.getElementById('loading').innerHTML = "❌ Gagal memuatkan data. Sila pastikan URL API betul.";
    });

function processData(data) {
    // 1. STATISTIK UTAMA
    const total = data.length;
    
    // Cari kolum status pelepasan fasa 2 (kita guna keyword 'FASA PELEPASAN 2')
    const colStatusF2 = Object.keys(data[0]).find(k => k.includes("STATUS MATA PELAJARAN TERKINI (FASA PELEPASAN 2)"));
    const colStatusF1 = Object.keys(data[0]).find(k => k.includes("STATUS MATA PELAJARAN TERKINI (FASA PELEPASAN 1)"));
    const colOKU = Object.keys(data[0]).find(k => k.includes("STATUS OKU (FASA PELEPASAN 2)"));
    const colPakk = "KATEGORI PAKK";

    const lulus = data.filter(d => String(d[colStatusF2]).includes("ARUS PERDANA")).length;
    const sekolah = new Set(data.map(d => d["NAMA SEKOLAH"])).size;
    const oku = data.filter(d => String(d[colOKU]).toUpperCase() === "YA").length;

    document.getElementById('statTotal').innerText = total;
    document.getElementById('statLulus').innerText = lulus;
    document.getElementById('statSekolah').innerText = sekolah;
    document.getElementById('statOKU').innerText = oku;

    // 2. CARTA DARJAH
    const grades = {};
    data.forEach(d => {
        let g = d["DARJAH"] || "N/A";
        grades[g] = (grades[g] || 0) + 1;
    });

    new Chart(document.getElementById('gradeChart'), {
        type: 'bar',
        data: {
            labels: Object.keys(grades),
            datasets: [{
                label: 'Bil. Murid',
                data: Object.values(grades),
                backgroundColor: '#3b82f6'
            }]
        }
    });

    // 3. CARTA PAKK
    const pakkStats = {};
    data.forEach(d => {
        let p = d[colPakk] || "TIADA DATA";
        pakkStats[p] = (pakkStats[p] || 0) + 1;
    });

    new Chart(document.getElementById('pakkChart'), {
        type: 'pie',
        data: {
            labels: Object.keys(pakkStats),
            datasets: [{
                data: Object.values(pakkStats),
                backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6']
            }]
        }
    });

    // 4. JADUAL MURID
    const tableBody = document.querySelector('#tableMurid tbody');
    data.forEach(d => {
        tableBody.innerHTML += `
            <tr class="hover:bg-gray-50 border-b">
                <td class="p-2">${d["NAMA MURID"]}</td>
                <td class="p-2 text-xs">${d["NAMA SEKOLAH"]}</td>
                <td class="p-2 text-center">${d["DARJAH"]}</td>
                <td class="p-2 text-xs">${d[colStatusF1] || '-'}</td>
                <td class="p-2 text-xs font-bold text-blue-700">${d[colStatusF2] || '-'}</td>
                <td class="p-2 text-center text-xs">${d[colOKU] || 'TIDAK'}</td>
            </tr>
        `;
    });
    $('#tableMurid').DataTable({ 
        responsive: true,
        pageLength: 10,
        language: { search: "Cari Murid/Sekolah:" }
    });
}
    </script>
</body>
</html>
