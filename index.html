<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pelepasan PMK 2025</title>
    
    <!-- Google Fonts & Frameworks -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .card-hover:hover { transform: translateY(-5px); transition: all 0.3s ease; }
        
        /* DataTable Styling */
        .dataTables_wrapper .dataTables_filter { margin-bottom: 20px; }
        .dataTables_wrapper .dataTables_filter input {
            border: 1px solid #e2e8f0;
            padding: 8px 15px;
            border-radius: 10px;
            outline: none;
            width: 250px;
        }
        table.dataTable thead th { border-bottom: 1px solid #e2e8f0 !important; }
        .dataTables_wrapper .dataTables_paginate .paginate_button.current { 
            background: #1e40af !important; color: white !important; border-radius: 8px; border: none;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- Navbar -->
    <nav class="bg-indigo-900 text-white shadow-xl sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-white p-2 rounded-lg text-indigo-900">
                    <i data-lucide="layout-dashboard"></i>
                </div>
                <h1 class="text-lg font-bold tracking-tight uppercase">Dashboard Pelepasan PMK 2025</h1>
            </div>
            <div id="lastUpdated" class="text-xs opacity-70 italic">Memuatkan data...</div>
        </div>
    </nav>

    <div class="container mx-auto px-6 py-8">
        
        <!-- Filter Bar -->
        <div class="glass p-6 rounded-2xl shadow-sm mb-8 flex flex-wrap gap-4 items-center border border-white">
            <div class="flex-1 min-w-[250px]">
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-2">Pilih Sekolah</label>
                <select id="schoolFilter" class="w-full bg-white border border-slate-200 p-2.5 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none cursor-pointer">
                    <option value="ALL">SEMUA SEKOLAH</option>
                </select>
            </div>
            <div class="w-48">
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-2">Tapis Darjah</label>
                <select id="gradeFilter" class="w-full bg-white border border-slate-200 p-2.5 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none cursor-pointer">
                    <option value="ALL">SEMUA</option>
                    <option value="2">TAHUN 2</option>
                    <option value="3">TAHUN 3</option>
                    <option value="4">TAHUN 4</option>
                    <option value="5">TAHUN 5</option>
                    <option value="6">TAHUN 6</option>
                </select>
            </div>
            <div class="pt-6">
                <button onclick="resetFilters()" class="bg-slate-200 hover:bg-slate-300 px-4 py-2 rounded-xl text-slate-700 text-sm font-medium transition-all flex items-center gap-2">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Reset
                </button>
            </div>
        </div>

        <!-- KPI Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 card-hover">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-slate-500 text-xs font-bold uppercase tracking-wider">Jumlah Murid</p>
                        <h3 id="statTotal" class="text-3xl font-bold mt-1">0</h3>
                    </div>
                    <div class="bg-indigo-100 p-3 rounded-xl text-indigo-600"><i data-lucide="users"></i></div>
                </div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 card-hover">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-slate-500 text-xs font-bold uppercase tracking-wider">Arus Perdana</p>
                        <h3 id="statLulus" class="text-3xl font-bold mt-1 text-emerald-600">0</h3>
                    </div>
                    <div class="bg-emerald-100 p-3 rounded-xl text-emerald-600"><i data-lucide="check-circle-2"></i></div>
                </div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 card-hover">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-slate-500 text-xs font-bold uppercase tracking-wider">Sekolah</p>
                        <h3 id="statSekolah" class="text-3xl font-bold mt-1">0</h3>
                    </div>
                    <div class="bg-orange-100 p-3 rounded-xl text-orange-600"><i data-lucide="school"></i></div>
                </div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 card-hover text-rose-600">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-slate-500 text-xs font-bold uppercase tracking-wider">Murid OKU</p>
                        <h3 id="statOKU" class="text-3xl font-bold mt-1">0</h3>
                    </div>
                    <div class="bg-rose-100 p-3 rounded-xl"><i data-lucide="info"></i></div>
                </div>
            </div>
        </div>

        <!-- Charts Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
            <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
                <h4 class="font-bold text-slate-700 mb-6 flex items-center gap-2">
                    <i data-lucide="bar-chart-2" class="w-5 h-5 text-indigo-500"></i> Analisis Mengikut Darjah
                </h4>
                <div class="h-64"><canvas id="gradeChart"></canvas></div>
            </div>
            <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
                <h4 class="font-bold text-slate-700 mb-6 flex items-center gap-2">
                    <i data-lucide="pie-chart" class="w-5 h-5 text-indigo-500"></i> Kategori PAKK (Prasekolah)
                </h4>
                <div class="h-64"><canvas id="pakkChart"></canvas></div>
            </div>
        </div>

        <!-- Table Card -->
        <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
            <h4 class="font-bold text-slate-700 mb-6 flex items-center gap-2 underline decoration-indigo-200">
                <i data-lucide="list-checks" class="w-5 h-5"></i> Senarai Perincian Murid
            </h4>
            <table id="tableMurid" class="w-full text-left">
                <thead>
                    <tr class="bg-slate-50 text-slate-500 text-[10px] uppercase font-bold tracking-widest">
                        <th class="p-3">Nama Murid</th>
                        <th class="p-3">Sekolah</th>
                        <th class="p-3 text-center">Darjah</th>
                        <th class="p-3">Pencapaian Akhir (F2)</th>
                        <th class="p-3 text-center">Status OKU</th>
                    </tr>
                </thead>
                <tbody class="text-sm divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbx9NW2fwiJZAYOAfRfBlfDDLnoABkj4uJ4UUZE6yPWzdhGoi8Qb9toMEIg5Vy2rFVG4bQ/exec";
        let masterData = [];
        let gradeChart, pakkChart;

        async function loadData() {
            try {
                const res = await fetch(API_URL + "?t=" + new Date().getTime());
                masterData = await res.json();
                
                // Initialize Icons
                lucide.createIcons();
                
                populateFilters(masterData);
                renderDashboard(masterData);
                
                document.getElementById('lastUpdated').innerText = "Data Terkini: " + new Date().toLocaleTimeString();
            } catch (err) {
                console.error("Fetch error:", err);
                document.getElementById('lastUpdated').innerText = "Ralat memuatkan data.";
            }
        }

        function populateFilters(data) {
            const schoolDropdown = document.getElementById('schoolFilter');
            const schools = [...new Set(data.map(d => d["NAMA SEKOLAH"]))].sort();
            
            // Clean dropdown first
            schoolDropdown.innerHTML = '<option value="ALL">SEMUA SEKOLAH</option>';
            schools.forEach(school => {
                if(school) {
                    const opt = document.createElement('option');
                    opt.value = school;
                    opt.innerText = school;
                    schoolDropdown.appendChild(opt);
                }
            });
        }

        function applyFilters() {
            const selectedSchool = document.getElementById('schoolFilter').value;
            const selectedGrade = document.getElementById('gradeFilter').value;

            let filtered = masterData;

            if (selectedSchool !== "ALL") {
                filtered = filtered.filter(d => d["NAMA SEKOLAH"] === selectedSchool);
            }
            if (selectedGrade !== "ALL") {
                filtered = filtered.filter(d => String(d["DARJAH"]) === selectedGrade);
            }

            renderDashboard(filtered);
        }

        document.getElementById('schoolFilter').addEventListener('change', applyFilters);
        document.getElementById('gradeFilter').addEventListener('change', applyFilters);

        function resetFilters() {
            document.getElementById('schoolFilter').value = "ALL";
            document.getElementById('gradeFilter').value = "ALL";
            renderDashboard(masterData);
        }

        function renderDashboard(data) {
            if (!data || data.length === 0) return;

            // 1. Mapping Kolum secara dinamik dan "Smart"
            const keys = Object.keys(data[0]);
            const getCol = (terms) => keys.find(k => terms.some(t => k.toUpperCase().includes(t.toUpperCase())));

            const colNama = getCol(["NAMA MURID"]);
            const colSekolah = getCol(["NAMA SEKOLAH"]);
            const colDarjah = getCol(["DARJAH"]);
            const colStatusF2 = getCol(["FASA PELEPASAN 2", "TERKINI"]);
            const colOKU = getCol(["STATUS OKU (FASA PELEPASAN 2)", "OKU"]);
            const colPakk = getCol(["KATEGORI PAKK", "PAKK"]);

            // 2. Statistik
            const total = data.length;
            const lulusCount = data.filter(d => String(d[colStatusF2] || "").replace(/\s+/g, ' ').toUpperCase().includes("ARUS PERDANA")).length;
            const schoolCount = new Set(data.map(d => d[colSekolah])).size;
            
            // Logik OKU yang lebih luas (terima 'YA' atau catatan lain)
            const okuCount = data.filter(d => {
                let val = String(d[colOKU] || "").toUpperCase().trim();
                return val !== "TIDAK" && val !== "TIADA" && val !== "" && val !== "0";
            }).length;

            document.getElementById('statTotal').innerText = total;
            document.getElementById('statLulus').innerText = lulusCount;
            document.getElementById('statSekolah').innerText = schoolCount;
            document.getElementById('statOKU').innerText = okuCount;

            // 3. Carta Darjah (Bar)
            const gMap = {};
            data.forEach(d => { let v = d[colDarjah] || "N/A"; gMap[v] = (gMap[v] || 0) + 1; });
            if(gradeChart) gradeChart.destroy();
            gradeChart = new Chart(document.getElementById('gradeChart'), {
                type: 'bar',
                data: {
                    labels: Object.keys(gMap).sort(),
                    datasets: [{ label: 'Murid', data: Object.values(gMap), backgroundColor: '#6366f1', borderRadius: 8 }]
                },
                options: { 
                    maintainAspectRatio: false, 
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, grid: { display: false } }, x: { grid: { display: false } } }
                }
            });

            // 4. Carta PAKK (Doughnut)
            const pMap = {};
            data.forEach(d => { 
                let v = String(d[colPakk] || "").trim().toUpperCase();
                if (!v || v === "0" || v === "TIADA") v = "TIADA MAKLUMAT";
                pMap[v] = (pMap[v] || 0) + 1; 
            });
            if(pakkChart) pakkChart.destroy();
            pakkChart = new Chart(document.getElementById('pakkChart'), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(pMap),
                    datasets: [{ 
                        data: Object.values(pMap), 
                        backgroundColor: ['#6366f1','#10b981','#f59e0b','#ef4444','#8b5cf6','#94a3b8'],
                        borderWidth: 4,
                        borderColor: '#ffffff'
                    }]
                },
                options: { 
                    maintainAspectRatio: false, 
                    cutout: '70%',
                    plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, font: { size: 10 } } } } 
                }
            });

            // 5. Jadual (DataTable)
            if ($.fn.DataTable.isDataTable('#tableMurid')) $('#tableMurid').DataTable().destroy();
            const tableBody = document.querySelector('#tableMurid tbody');
            tableBody.innerHTML = data.map(d => {
                let statusRaw = String(d[colStatusF2] || "");
                let statusClean = statusRaw.replace(/\s+/g, ' ');
                let isLulus = statusClean.toUpperCase().includes("ARUS PERDANA");
                let stOKU = String(d[colOKU] || "").toUpperCase().trim();
                let hasOKU = stOKU !== "TIDAK" && stOKU !== "" && stOKU !== "TIADA";
                
                return `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="p-3 font-semibold text-xs uppercase tracking-wide">${d[colNama] || '-'}</td>
                        <td class="p-3 text-[10px] text-slate-500">${d[colSekolah] || '-'}</td>
                        <td class="p-3 text-center font-bold text-indigo-600">${d[colDarjah] || '-'}</td>
                        <td class="p-3">
                            <span class="px-2 py-1 rounded-lg text-[9px] font-bold border ${isLulus ? 'bg-emerald-50 text-emerald-700 border-emerald-100' : 'bg-blue-50 text-blue-700 border-blue-100'} uppercase">
                                ${statusClean}
                            </span>
                        </td>
                        <td class="p-3 text-center text-xs font-bold ${hasOKU ? 'text-rose-600' : 'text-slate-300'}">${hasOKU ? 'YA' : 'TIDAK'}</td>
                    </tr>
                `;
            }).join('');
            
            $('#tableMurid').DataTable({ 
                pageLength: 10, 
                responsive: true,
                language: { search: "", searchPlaceholder: "Carian Pantas..." }
            });
        }

        // Init
        loadData();
        // Auto update setiap 5 minit
        setInterval(loadData, 300000);
    </script>
</body>
</html>
