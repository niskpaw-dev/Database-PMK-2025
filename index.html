<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pelepasan PMK 2025</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
</head>
<body class="bg-slate-50 min-h-screen">

    <nav class="bg-blue-900 p-4 text-white shadow-lg">
        <div class="container mx-auto">
            <h1 class="text-xl font-bold uppercase tracking-wider text-center">Dashboard Analisis Pelepasan 2 PMK 2025</h1>
        </div>
    </nav>

    <div class="container mx-auto p-6">
        <!-- Loading Spinner -->
        <div id="loading" class="text-center py-10 text-blue-600 font-bold">
            Memuatkan Data dari Google Sheets...
        </div>

        <!-- Dashboard Content (Hidden until loaded) -->
        <div id="content" class="hidden">
            <!-- Scorecards -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
                <div class="bg-white p-6 rounded-xl shadow-md border-l-8 border-blue-500">
                    <p class="text-gray-500 text-sm font-semibold uppercase">Jumlah Murid</p>
                    <h3 id="statTotal" class="text-3xl font-bold">0</h3>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-md border-l-8 border-green-500">
                    <p class="text-gray-500 text-sm font-semibold uppercase">Lulus Arus Perdana</p>
                    <h3 id="statLulus" class="text-3xl font-bold text-green-600">0</h3>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-md border-l-8 border-orange-500">
                    <p class="text-gray-500 text-sm font-semibold uppercase">Bilangan Sekolah</p>
                    <h3 id="statSekolah" class="text-3xl font-bold">0</h3>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-md border-l-8 border-red-500">
                    <p class="text-gray-500 text-sm font-semibold uppercase">Murid OKU</p>
                    <h3 id="statOKU" class="text-3xl font-bold text-red-600">0</h3>
                </div>
            </div>

            <!-- Charts Row -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-10">
                <div class="bg-white p-6 rounded-xl shadow-md">
                    <h4 class="font-bold mb-4 text-gray-700">Analisis Perbandingan Darjah</h4>
                    <canvas id="gradeChart"></canvas>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-md">
                    <h4 class="font-bold mb-4 text-gray-700">Kategori PAKK (Prasekolah)</h4>
                    <canvas id="pakkChart"></canvas>
                </div>
            </div>

            <!-- Table Row -->
            <div class="bg-white p-8 rounded-xl shadow-md overflow-x-auto">
                <h4 class="font-bold mb-6 text-gray-700 underline">Senarai Perincian Murid</h4>
                <table id="tableMurid" class="display w-full border-collapse">
                    <thead class="bg-gray-100 text-xs">
                        <tr>
                            <th>NAMA MURID</th>
                            <th>SEKOLAH</th>
                            <th>DARJAH</th>
                            <th>STATUS F1</th>
                            <th>STATUS F2</th>
                            <th>OKU</th>
                        </tr>
                    </thead>
                    <tbody class="text-sm"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <script>
        // GANTIKAN DENGAN URL WEB APP GAS ANDA
        const API_URL = "https://script.google.com/macros/s/AKfycbx9NW2fwiJZAYOAfRfBlfDDLnoABkj4uJ4UUZE6yPWzdhGoi8Qb9toMEIg5Vy2rFVG4bQ/exec";
let gradeChart, pakkChart; // Simpan rujukan carta supaya boleh di-update

// Fungsi untuk menarik data
function fetchLatestData() {
    console.log("Menarik data terkini...");
    
    // Tambah timestamp unik di hujung URL supaya browser tidak ambil data 'cache' lama
    const fetchUrl = API_URL + "?t=" + new Date().getTime();

    fetch(fetchUrl)
        .then(res => res.json())
        .then(data => {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('content').classList.remove('hidden');
            
            // Kemaskini masa terakhir dikemaskini (pilihan)
            const masaTerkini = new Date().toLocaleTimeString();
            console.log("Data dikemaskini pada: " + masaTerkini);

            processData(data);
        })
        .catch(err => {
            console.error("Gagal menarik data:", err);
        });
}

// Jalankan kali pertama bila buka page
fetchLatestData();

// AUTO UPDATE: Jalankan fungsi ini setiap 5 minit (300000 milisaat)
setInterval(fetchLatestData, 300000); 

function processData(data) {
    const getCol = (searchTerms) => {
        const keys = Object.keys(data[0]);
        return keys.find(k => searchTerms.some(term => k.includes(term.toUpperCase())));
    };

    const colNama = getCol(["NAMA MURID"]);
    const colSekolah = getCol(["NAMA SEKOLAH", "KOD SEKOLAH"]);
    const colDarjah = getCol(["DARJAH"]);
    const colStatusF1 = getCol(["FASA PELEPASAN 1"]);
    const colStatusF2 = getCol(["FASA PELEPASAN 2", "TERKINI"]);
    const colOKU = getCol(["STATUS OKU (FASA PELEPASAN 2)", "OKU"]);
    const colPakk = getCol(["PAKK"]);

    // 1. UPDATE STATISTIK
    document.getElementById('statTotal').innerText = data.length;
    document.getElementById('statLulus').innerText = data.filter(d => String(d[colStatusF2]).toUpperCase().includes("ARUS PERDANA")).length;
    document.getElementById('statSekolah').innerText = new Set(data.map(d => d[colSekolah])).size;
    document.getElementById('statOKU').innerText = data.filter(d => String(d[colOKU]).toUpperCase() === "YA").length;

    // 2. UPDATE CARTA DARJAH
    const gradeData = {};
    data.forEach(d => { let val = d[colDarjah] || "N/A"; gradeData[val] = (gradeData[val] || 0) + 1; });

    if (gradeChart) gradeChart.destroy(); // Padam carta lama sebelum bina baru
    gradeChart = new Chart(document.getElementById('gradeChart'), {
        type: 'bar',
        data: {
            labels: Object.keys(gradeData),
            datasets: [{ label: 'Bil. Murid', data: Object.values(gradeData), backgroundColor: '#3b82f6' }]
        }
    });

    // 3. UPDATE CARTA PAKK
    const pakkData = {};
    data.forEach(d => { let val = d[colPakk] || "TIADA DATA"; pakkData[val] = (pakkData[val] || 0) + 1; });

    if (pakkChart) pakkChart.destroy(); // Padam carta lama sebelum bina baru
    pakkChart = new Chart(document.getElementById('pakkChart'), {
        type: 'doughnut',
        data: {
            labels: Object.keys(pakkData),
            datasets: [{ data: Object.values(pakkData), backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'] }]
        }
    });

    // 4. UPDATE JADUAL (Destroy & Re-init DataTable)
    if ($.fn.DataTable.isDataTable('#tableMurid')) {
        $('#tableMurid').DataTable().clear().destroy();
    }

    const tableBody = document.querySelector('#tableMurid tbody');
    tableBody.innerHTML = ""; 
    data.forEach(d => {
        tableBody.innerHTML += `
            <tr>
                <td>${d[colNama] || '-'}</td>
                <td>${d[colSekolah] || '-'}</td>
                <td class="text-center">${d[colDarjah] || '-'}</td>
                <td class="text-xs">${d[colStatusF1] || '-'}</td>
                <td class="font-bold text-blue-700 text-xs">${d[colStatusF2] || '-'}</td>
                <td class="text-center text-xs">${d[colOKU] || 'TIDAK'}</td>
            </tr>
        `;
    });
    $('#tableMurid').DataTable({ responsive: true });
}
    </script>
</body>
</html>
