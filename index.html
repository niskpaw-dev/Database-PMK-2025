<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DASHBOARD PMK 2025</title>
    
    <!-- Frameworks -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.4); }
        .kpi-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .kpi-card:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
        .dataTables_filter input {
            border: 1px solid #e2e8f0 !important;
            padding: 10px 20px !important;
            border-radius: 14px !important;
            width: 300px !important;
            outline: none !important;
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        }
    </style>
</head>
<body class="bg-[#f8fafc] min-h-screen text-slate-900">

    <!-- Navbar Modern -->
    <nav class="bg-indigo-950 text-white shadow-2xl sticky top-0 z-50">
        <div class="container mx-auto px-8 py-5 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="bg-indigo-500 p-2.5 rounded-2xl shadow-lg shadow-indigo-500/30 text-white">
                    <i data-lucide="line-chart" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight">ANALISIS PELEPASAN 2 PMK</h1>
                    <p class="text-[10px] text-indigo-300 font-bold tracking-[0.2em] uppercase">Sektor Pembelajaran 2025</p>
                </div>
            </div>
            <div class="text-right">
                <div id="lastUpdated" class="text-xs font-semibold bg-indigo-900/50 px-4 py-2 rounded-full border border-indigo-800">Memuatkan...</div>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-8 py-10">
        
        <!-- Filter Bar -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 mb-10 items-end">
            <div class="lg:col-span-6">
                <label class="block text-[11px] font-black text-slate-400 uppercase mb-3 tracking-widest ml-1">Pusat Maklumat / Sekolah</label>
                <select id="schoolFilter" class="w-full glass border-slate-200 p-4 rounded-2xl text-sm font-semibold focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all cursor-pointer shadow-sm">
                    <option value="ALL">SEMUA SEKOLAH</option>
                </select>
            </div>
            <div class="lg:col-span-4">
                <label class="block text-[11px] font-black text-slate-400 uppercase mb-3 tracking-widest ml-1">Tahun / Darjah</label>
                <select id="gradeFilter" class="w-full glass border-slate-200 p-4 rounded-2xl text-sm font-semibold focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all cursor-pointer shadow-sm">
                    <option value="ALL">SEMUA DARJAH</option>
                    <option value="2">TAHUN 2</option>
                    <option value="3">TAHUN 3</option>
                    <option value="4">TAHUN 4</option>
                    <option value="5">TAHUN 5</option>
                    <option value="6">TAHUN 6</option>
                </select>
            </div>
            <div class="lg:col-span-2">
                <button onclick="resetFilters()" class="w-full bg-slate-900 text-white hover:bg-slate-800 p-4 rounded-2xl font-bold transition-all shadow-lg flex justify-center items-center gap-2">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i> RESET
                </button>
            </div>
        </div>

        <!-- KPI Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-12">
            <!-- Card 1 -->
            <div class="bg-white p-7 rounded-[2rem] shadow-sm border border-slate-100 kpi-card">
                <div class="flex justify-between items-center mb-4">
                    <div class="p-3 bg-indigo-50 rounded-2xl text-indigo-600"><i data-lucide="users-2"></i></div>
                    <span class="text-[10px] font-bold text-indigo-400 bg-indigo-50 px-3 py-1 rounded-full uppercase">Total</span>
                </div>
                <p class="text-slate-500 text-xs font-bold uppercase tracking-widest">Enrolmen Murid</p>
                <h3 id="statTotal" class="text-4xl font-black mt-2 tracking-tighter">0</h3>
            </div>
            <!-- Card 2 -->
            <div class="bg-white p-7 rounded-[2rem] shadow-sm border border-slate-100 kpi-card">
                <div class="flex justify-between items-center mb-4">
                    <div class="p-3 bg-emerald-50 rounded-2xl text-emerald-600"><i data-lucide="check-circle"></i></div>
                    <span class="text-[10px] font-bold text-emerald-400 bg-emerald-50 px-3 py-1 rounded-full uppercase">Success</span>
                </div>
                <p class="text-slate-500 text-xs font-bold uppercase tracking-widest">Arus Perdana</p>
                <h3 id="statLulus" class="text-4xl font-black mt-2 text-emerald-600 tracking-tighter">0</h3>
            </div>
            <!-- Card 3 -->
            <div class="bg-white p-7 rounded-[2rem] shadow-sm border border-slate-100 kpi-card">
                <div class="flex justify-between items-center mb-4">
                    <div class="p-3 bg-orange-50 rounded-2xl text-orange-600"><i data-lucide="school"></i></div>
                    <span class="text-[10px] font-bold text-orange-400 bg-orange-50 px-3 py-1 rounded-full uppercase">Network</span>
                </div>
                <p class="text-slate-500 text-xs font-bold uppercase tracking-widest">Sekolah</p>
                <h3 id="statSekolah" class="text-4xl font-black mt-2 text-orange-600 tracking-tighter">0</h3>
            </div>
            <!-- Card 4 -->
            <div class="bg-indigo-600 p-7 rounded-[2rem] shadow-xl kpi-card text-white relative overflow-hidden">
                <div class="relative z-10">
                    <div class="flex justify-between items-center mb-4">
                        <div class="p-3 bg-white/20 rounded-2xl text-white"><i data-lucide="trending-up"></i></div>
                    </div>
                    <p class="text-indigo-200 text-xs font-bold uppercase tracking-widest">Kadar Pelepasan</p>
                    <h3 id="statKadar" class="text-4xl font-black mt-2 tracking-tighter">0%</h3>
                </div>
                <div class="absolute -right-4 -bottom-4 text-white/10 rotate-12"><i data-lucide="trending-up" class="w-32 h-32"></i></div>
            </div>
        </div>

        <!-- Main Analytics -->
        <div class="bg-white p-10 rounded-[2.5rem] shadow-sm border border-slate-100 mb-12">
            <h4 class="font-black text-slate-700 mb-10 flex items-center gap-4 text-xl">
                <span class="w-3 h-10 bg-indigo-600 rounded-full shadow-lg shadow-indigo-200"></span>
                PRESTASI MURID MENGIKUT DARJAH
            </h4>
            <div class="h-[400px]"><canvas id="gradeChart"></canvas></div>
        </div>

        <!-- Data Table Card -->
        <div class="bg-white p-10 rounded-[2.5rem] shadow-sm border border-slate-100">
            <h4 class="font-black text-slate-700 mb-8 flex items-center gap-4 text-xl">
                <span class="w-3 h-10 bg-indigo-600 rounded-full shadow-lg shadow-indigo-200"></span>
                PERINCIAN DATA MURID
            </h4>
            <div class="overflow-x-auto">
                <table id="tableMurid" class="w-full">
                    <thead>
                        <tr class="text-slate-400 text-[11px] uppercase font-black tracking-widest border-b-2 border-slate-50">
                            <th class="pb-6">Nama Murid</th>
                            <th class="pb-6">Nama Sekolah</th>
                            <th class="pb-6 text-center">Darjah</th>
                            <th class="pb-6 text-center">Keputusan Akhir</th>
                        </tr>
                    </thead>
                    <tbody class="text-sm divide-y divide-slate-50"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbx9NW2fwiJZAYOAfRfBlfDDLnoABkj4uJ4UUZE6yPWzdhGoi8Qb9toMEIg5Vy2rFVG4bQ/exec";
        let masterData = [];
        let gradeChart;

        lucide.createIcons();

        async function loadData() {
            try {
                const res = await fetch(API_URL + "?t=" + new Date().getTime());
                masterData = await res.json();
                populateFilters(masterData);
                renderDashboard(masterData);
                document.getElementById('lastUpdated').innerText = "Kemas Kini: " + new Date().toLocaleTimeString();
            } catch (err) {
                console.error("Fetch error:", err);
                document.getElementById('lastUpdated').innerText = "Ralat Sambungan API";
            }
        }

        function populateFilters(data) {
            const schoolDropdown = document.getElementById('schoolFilter');
            const schools = [...new Set(data.map(d => d["NAMA SEKOLAH"]))].sort();
            schoolDropdown.innerHTML = '<option value="ALL">SEMUA SEKOLAH</option>';
            schools.forEach(s => {
                if(s) schoolDropdown.innerHTML += `<option value="${s}">${s}</option>`;
            });
        }

        function applyFilters() {
            const sSchool = document.getElementById('schoolFilter').value;
            const sGrade = document.getElementById('gradeFilter').value;
            let filtered = masterData;
            if (sSchool !== "ALL") filtered = filtered.filter(d => d["NAMA SEKOLAH"] === sSchool);
            if (sGrade !== "ALL") filtered = filtered.filter(d => String(d["DARJAH"]) === sGrade);
            renderDashboard(filtered);
        }

        document.getElementById('schoolFilter').addEventListener('change', applyFilters);
        document.getElementById('gradeFilter').addEventListener('change', applyFilters);

        function resetFilters() {
            document.getElementById('schoolFilter').value = "ALL";
            document.getElementById('gradeFilter').value = "ALL";
            renderDashboard(masterData);
        }

        function renderDashboard(data) {
            if (!data || data.length === 0) return;

            // Auto-detect columns
            const keys = Object.keys(data[0]);
            const getCol = (terms) => keys.find(k => terms.some(t => k.includes(t.toUpperCase())));
            
            const colNama = getCol(["NAMA MURID"]);
            const colSekolah = getCol(["NAMA SEKOLAH"]);
            const colDarjah = getCol(["DARJAH"]);
            const colStatusF2 = getCol(["FASA PELEPASAN 2", "TERKINI"]);

            // KPI logic
            const total = data.length;
            const lulusCount = data.filter(d => String(d[colStatusF2] || "").replace(/\s+/g, ' ').toUpperCase().includes("ARUS PERDANA")).length;
            const successRate = total > 0 ? ((lulusCount / total) * 100).toFixed(1) : 0;

            document.getElementById('statTotal').innerText = total.toLocaleString();
            document.getElementById('statLulus').innerText = lulusCount.toLocaleString();
            document.getElementById('statSekolah').innerText = new Set(data.map(d => d[colSekolah])).size;
            document.getElementById('statKadar').innerText = successRate + "%";

            // Bar Chart
            const gMap = {};
            data.forEach(d => { let v = d[colDarjah] || "N/A"; gMap[v] = (gMap[v] || 0) + 1; });
            
            if(gradeChart) gradeChart.destroy();
            gradeChart = new Chart(document.getElementById('gradeChart'), {
                type: 'bar',
                data: {
                    labels: Object.keys(gMap).sort(),
                    datasets: [{ 
                        label: 'Bilangan Murid', 
                        data: Object.values(gMap), 
                        backgroundColor: '#6366f1',
                        hoverBackgroundColor: '#4338ca',
                        borderRadius: 15,
                        barThickness: 45
                    }]
                },
                options: { 
                    maintainAspectRatio: false, 
                    plugins: { legend: { display: false } },
                    scales: { 
                        y: { grid: { color: '#f1f5f9' }, ticks: { font: { weight: 'bold' } } }, 
                        x: { grid: { display: false }, ticks: { font: { weight: 'bold' } } } 
                    }
                }
            });

            // Table
            if ($.fn.DataTable.isDataTable('#tableMurid')) $('#tableMurid').DataTable().destroy();
            const tableBody = document.querySelector('#tableMurid tbody');
            tableBody.innerHTML = data.map(d => {
                const sText = String(d[colStatusF2] || "").replace(/\s+/g, ' ');
                const isAP = sText.toUpperCase().includes("ARUS PERDANA");
                
                return `
                    <tr class="hover:bg-slate-50 transition-all">
                        <td class="py-5 font-bold text-slate-700 text-xs uppercase tracking-tight">${d[colNama] || '-'}</td>
                        <td class="py-5 text-[11px] text-slate-500 font-medium">${d[colSekolah] || '-'}</td>
                        <td class="py-5 text-center font-black text-indigo-600 underline decoration-indigo-100 underline-offset-4">${d[colDarjah] || '-'}</td>
                        <td class="py-5 text-center">
                            <span class="px-4 py-2 rounded-xl text-[10px] font-black border ${isAP ? 'bg-emerald-50 text-emerald-700 border-emerald-100 shadow-sm shadow-emerald-100' : 'bg-indigo-50 text-indigo-700 border-indigo-100'} uppercase">
                                ${sText || '-'}
                            </span>
                        </td>
                    </tr>
                `;
            }).join('');
            
            $('#tableMurid').DataTable({ 
                pageLength: 10, 
                responsive: true,
                language: { search: "", searchPlaceholder: "Carian Pantas Murid..." }
            });
        }

        loadData();
        setInterval(loadData, 300000); // Auto-update 5 minit
    </script>
</body>
</html>
